name: Rename HTML to index.html

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and rename HTML file to index.html
        run: |
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" ! -name "index.html" | head -1)
          if [ -n "$HTML_FILE" ]; then
            mv "$HTML_FILE" index.html
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add index.html
            git rm --cached "$HTML_FILE" 2>/dev/null || true
            git commit -m "auto: rename to index.html"
            git push
          fi
